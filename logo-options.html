<!doctype html>
<html><head><meta charset="utf-8"/><title>Logo options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap"/>
<style>
body{margin:0;font-family:"Inter Tight",sans-serif;background:#FAF7F2;color:#0E1A2B;padding:60px}
h1{font-size:32px;font-weight:500;letter-spacing:-.02em;margin-bottom:8px}
.sub{color:#5F5E5A;margin-bottom:48px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.card{border:1px solid rgba(14,26,43,.12);border-radius:8px;overflow:hidden}
.swatch{padding:60px 40px;display:flex;align-items:center;justify-content:center;min-height:200px}
.swatch.dark{background:#0E1A2B}
.swatch.bone{background:#FAF7F2;border-bottom:1px solid rgba(14,26,43,.1)}
.swatch img{max-height:80px;max-width:100%;display:block}
.label{padding:24px;display:flex;justify-content:space-between;align-items:center}
.label b{font-weight:500}
.label span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5F5E5A}
</style></head>
<body>
  <h1>GEMS Logo options</h1>
  <p class="sub">Two current-era logos found in your WordPress library. Click each to view full-res.</p>
  <div class="grid">
    <div class="card">
      <div class="swatch dark"><img src="https://gemstalent.com.sg/wordpress/wp-content/uploads/2025/06/GEMS-Logo-White-01-Photoroom.png" alt="Option 1"/></div>
      <div class="swatch bone"><img src="https://gemstalent.com.sg/wordpress/wp-content/uploads/2025/06/GEMS-Logo-White-01-Photoroom.png" style="filter:invert(1) brightness(.2)" alt="Option 1"/></div>
      <div class="label"><b>Option 1 — Wordmark (white)</b><span>Currently in use</span></div>
    </div>
    <div class="card">
      <div class="swatch dark"><img src="https://gemstalent.com.sg/wordpress/wp-content/uploads/2025/06/GEMS-Company-Stamp-Photoroom.png" alt="Option 2"/></div>
      <div class="swatch bone"><img src="https://gemstalent.com.sg/wordpress/wp-content/uploads/2025/06/GEMS-Company-Stamp-Photoroom.png" alt="Option 2"/></div>
      <div class="label"><b>Option 2 — Company Stamp</b><span>Alternate</span></div>
    </div>
  </div>
</body></html>
